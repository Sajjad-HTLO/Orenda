spring.application.name=AITP
spring.main.lazy-initialization=false

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/aitp
spring.datasource.username=postgres
spring.datasource.password=SajadShahin200200@1253##
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari pool sizing - crawler is effectively single-threaded (concurrency=1),
# so a small pool is plenty. Leaves headroom for a couple of concurrent
# persistence calls without wasting connections.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# Connection lifecycle - THIS is what fixes your crash.
# maxLifetime must be shorter than whatever is silently closing your
# connections (Postgres/OS/network idle timeout). Defaults (30 min max
# lifetime, no keepalive) let connections go stale in the pool.
spring.datasource.hikari.max-lifetime=270000
spring.datasource.hikari.idle-timeout=180000
spring.datasource.hikari.keepalive-time=120000

# Fail fast instead of hanging ~60s like your log showed
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000

# Helps you catch connection leaks in future crawler runs
spring.datasource.hikari.leak-detection-threshold=60000

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=false

spring.flyway.url=jdbc:postgresql://localhost:5432/aitp
spring.flyway.user=postgres
spring.flyway.password=postgres
# If you want Flyway to create the schema history table automatically
spring.flyway.create-schemas=true

# Spring Batch - auto-create metadata tables
spring.batch.jdbc.initialize-schema=always

# OSM import — set to true only when you want to (re)import the PBF file
spring.batch.job.enabled=false
# spring.batch.job.name=osmImportJob
osm.import.file-path=file:data/turkey-travel-named.osm.pbf
# Wikipedia enrichment — scheduled batch job with rate limiting
wikipedia.enrichment.enabled=false
wikipedia.enrichment.fixed-delay-ms=60000
wikipedia.enrichment.min-interval-ms=300
wikipedia.enrichment.max-items-per-run=50
wikipedia.enrichment.chunk-size=10
wikipedia.enrichment.parallelism=3
# Wikidata POI import — fetches tourist POIs from Wikidata SPARQL (free, no auth)
wikidata.import.enabled=false
wikidata.import.chunk-size=100
wikidata.import.initial-delay-ms=0
wikidata.import.fixed-delay-ms=604800000
wikidata.import.query-timeout-seconds=120
# muze.gov.tr import — scrapes museums and archaeological sites (free, no auth)
muzegov.import.enabled=false
muzegov.import.chunk-size=50
# Overpass API import — targeted OSM queries for tourist POIs (free, no auth)
overpass.import.enabled=false
overpass.import.chunk-size=100
overpass.import.initial-delay-ms=0
overpass.import.fixed-delay-ms=604800000
overpass.import.query-timeout-seconds=180

# Tripadvisor hotel listing crawler — disabled by default; enable for an on-demand CLI crawl.
tripadvisor.crawler.enabled=true
tripadvisor.crawler.base-url=https://www.tripadvisor.com/Hotels-g293974-oa5640-Istanbul-Hotels.html
tripadvisor.crawler.restaurants.base-url=https://www.tripadvisor.com/Restaurants-g293974-Istanbul.html
tripadvisor.crawler.concurrency=1
tripadvisor.crawler.page-size=30
tripadvisor.crawler.max-empty-pages=1
tripadvisor.crawler.single-page-only=false
tripadvisor.crawler.min-delay-ms=2500
tripadvisor.crawler.max-delay-ms=7000
tripadvisor.crawler.navigation-timeout-ms=60000
tripadvisor.crawler.headless=true
tripadvisor.crawler.user-agent=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36

# Tripadvisor restaurant listing crawler — disabled by default; enable for an on-demand CLI crawl.
tripadvisor.crawler.restaurants.enabled=false
tripadvisor.crawler.restaurants.base-url=https://www.tripadvisor.com/Restaurants-g293974-Istanbul.html
tripadvisor.crawler.restaurants.min-delay-ms=2500
tripadvisor.crawler.restaurants.max-delay-ms=7000
tripadvisor.crawler.restaurants.navigation-timeout-ms=60000
tripadvisor.crawler.restaurants.headless=true
tripadvisor.crawler.restaurants.user-agent=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36

# Keep Tripadvisor crawler diagnostics visible while validating extraction.
logging.level.com.sajad.AITP.tripadvisor=INFO
