spring.application.name=Orenda
spring.main.lazy-initialization=false

# Database
spring.datasource.url=jdbc:postgresql://ep-patient-butterfly-b2eahx4f.c-6.eu-central-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_D3XaBklu6Liv
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari pool sizing - crawler is effectively single-threaded (concurrency=1),
# so a small pool is plenty. Leaves headroom for a couple of concurrent
# persistence calls without wasting connections.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# Connection lifecycle - THIS is what fixes your crash.
# maxLifetime must be shorter than whatever is silently closing your
# connections (Postgres/OS/network idle timeout). Defaults (30 min max
# lifetime, no keepalive) let connections go stale in the pool.
spring.datasource.hikari.max-lifetime=270000
spring.datasource.hikari.idle-timeout=180000
spring.datasource.hikari.keepalive-time=120000

# Fail fast instead of hanging ~60s like your log showed
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000

# Helps you catch connection leaks in future crawler runs
spring.datasource.hikari.leak-detection-threshold=60000

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=false

spring.flyway.url=jdbc:postgresql://ep-patient-butterfly-b2eahx4f.c-6.eu-central-1.aws.neon.tech/neondb?sslmode=require
spring.flyway.user=neondb_owner
spring.flyway.password=npg_D3XaBklu6Liv
# If you want Flyway to create the schema history table automatically
spring.flyway.create-schemas=true

# Spring Batch - auto-create metadata tables
spring.batch.jdbc.initialize-schema=always

# OSM import — set to true only when you want to (re)import the PBF file
spring.batch.job.enabled=false
# spring.batch.job.name=osmImportJob
osm.import.file-path=file:data/turkey-travel-named.osm.pbf
# Wikipedia enrichment — scheduled batch job with rate limiting
wikipedia.enrichment.enabled=false
wikipedia.enrichment.fixed-delay-ms=60000
wikipedia.enrichment.min-interval-ms=300
wikipedia.enrichment.max-items-per-run=50
wikipedia.enrichment.chunk-size=10
wikipedia.enrichment.parallelism=3
# Wikidata POI import — fetches tourist POIs from Wikidata SPARQL (free, no auth)
wikidata.import.enabled=false
wikidata.import.chunk-size=100
wikidata.import.initial-delay-ms=0
wikidata.import.fixed-delay-ms=604800000
wikidata.import.query-timeout-seconds=120
wikidata.import.page-size=500
wikidata.import.max-pages-per-category=20
wikidata.import.inter-category-delay-ms=2000
# muze.gov.tr import — scrapes museums and archaeological sites (free, no auth)
muzegov.import.enabled=false
muzegov.import.chunk-size=50
# Overpass API import — targeted OSM queries for tourist POIs (free, no auth)
overpass.import.enabled=false
overpass.import.chunk-size=100
overpass.import.initial-delay-ms=0
overpass.import.fixed-delay-ms=604800000
overpass.import.query-timeout-seconds=180

# Tripadvisor hotel listing crawler — disabled by default; enable for an on-demand CLI crawl.
tripadvisor.crawler.enabled=true
tripadvisor.crawler.base-url=https://www.tripadvisor.com/Hotels-g293974-oa6990-Istanbul-Hotels.html
tripadvisor.crawler.concurrency=1
tripadvisor.crawler.page-size=30
tripadvisor.crawler.max-empty-pages=1
tripadvisor.crawler.single-page-only=false
tripadvisor.crawler.min-delay-ms=2500
tripadvisor.crawler.max-delay-ms=7000
tripadvisor.crawler.navigation-timeout-ms=60000
tripadvisor.crawler.headless=true
tripadvisor.crawler.user-agent=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36

# Tripadvisor restaurant listing crawler — disabled by default; enable for an on-demand CLI crawl.
tripadvisor.crawler.restaurants.enabled=true
tripadvisor.crawler.restaurants.base-url=https://www.tripadvisor.com/Restaurants-g293974-oa3060-Istanbul.html
tripadvisor.crawler.restaurants.concurrency=1
tripadvisor.crawler.restaurants.page-size=30
tripadvisor.crawler.restaurants.max-empty-pages=1
tripadvisor.crawler.restaurants.single-page-only=false
tripadvisor.crawler.restaurants.min-delay-ms=2500
tripadvisor.crawler.restaurants.max-delay-ms=7000
tripadvisor.crawler.restaurants.navigation-timeout-ms=60000
tripadvisor.crawler.restaurants.headless=true
tripadvisor.crawler.restaurants.user-agent=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36

# Tripadvisor image download — saves POI image binaries to local disk and references them in poi_image.
tripadvisor.crawler.image-download.enabled=true
tripadvisor.crawler.image-download.max-images-per-poi=50
tripadvisor.crawler.image-download.base-dir=data/tripadvisor-images

# Disk-space guard — the crawler stops image downloads and skips browser launches
# (instead of crashing Chromium with "Target crashed") when free disk drops below this.
tripadvisor.crawler.min-free-disk-bytes=1073741824

# Keep Tripadvisor crawler diagnostics visible while validating extraction.
logging.level.com.sajad.AITP.tripadvisor=INFO
logging.level.com.aitp.orenda.tripadvisor.image=DEBUG

# ── Auth ─────────────────────────────────────────────────────────────────────
# Base URL of this API (used to build absolute links, e.g. email verification).
app.base-url=http://localhost:8080

# JWT signing secret (HS256). Override with a long random string in production.
app.jwt.secret=orenda-dev-secret-change-me-to-a-long-random-string-256bit
app.jwt.expiration-ms=604800000

# ── Email ────────────────────────────────────────────────────────────────────
# mock=true logs verification emails instead of sending them (dev default).
app.mail.mock=true
app.mail.from=no-reply@orenda.app
app.mail.verification-subject=Verify your Orenda account
# Uncomment + fill to send real mail via SMTP, and set app.mail.mock=false.
spring.mail.host=
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Google OAuth (sign up / sign in with Google) ─────────────────────────────
# Create an OAuth 2.0 Client at https://console.cloud.google.com/apis/credentials
# and add "{app.base-url}/api/auth/google/callback" as an authorized redirect URI.
# Leave blank to disable the Google login flow (the endpoint returns a 503).
app.oauth.google.client-id=
app.oauth.google.client-secret=
# Where the browser is sent after a successful Google login, with ?token=<jwt>.
app.oauth.google.frontend-redirect-uri=http://localhost:3000/login
