# Do not run the OSM import batch job during tests
spring.batch.job.enabled=false
wikipedia.enrichment.enabled=false
# Same PostGIS instance as local dev (integration tests use the real database)
spring.datasource.url=jdbc:postgresql://localhost:5432/aitp
spring.datasource.username=postgres
spring.datasource.password=postgres

# Auth (test overrides — src/test/resources shadows the main application.properties)
app.base-url=http://localhost:8080
app.jwt.secret=test-secret-that-is-long-enough-for-hs256-signing-123456
app.jwt.expiration-ms=3600000
app.mail.mock=true
app.oauth.google.client-id=
app.oauth.google.client-secret=
app.oauth.google.frontend-redirect-uri=
