    # ── User profile ───────────────────────────────────────────────────────
    UpdateProfileRequest:
      type: object
      properties:
        fullName:
          type: string
          maxLength: 200
        avatarUrl:
          type: string
          maxLength: 500
        homeCity:
          type: string
          maxLength: 200
        dietaryRestrictions:
          type: array
          items:
            type: string

    # ── Reviews ────────────────────────────────────────────────────────────
    PoiReviewRequest:
      type: object
