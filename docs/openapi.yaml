      properties:
        rating:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
        title:
          type: string
          maxLength: 200
        comment:
          type: string
          maxLength: 4000
    PoiReviewResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        poiId:
          type: string
          format: uuid
        travelerName:
          type: string
          nullable: true
        rating:
          type: integer
          format: int32
        title:
          type: string
          nullable: true
        comment:
          type: string
          nullable: true
