          nullable: true
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        tripDays:
          type: integer
          format: int32
        summary:
          type: string
          nullable: true
        weatherSummary:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
    SavedTripDetailResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        destination:
          type: string
          nullable: true
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        tripDays:
          type: integer
          format: int32
        summary:
          type: string
          nullable: true
        weatherSummary:
          type: string
          nullable: true
        narrative:
          type: string
          nullable: true
        preferenceInsight:
          type: string
          nullable: true
        notes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        days:
          type: array
          items:
            $ref: '#/components/schemas/SavedTripDayResponse'
    SavedTripDayResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        day:
          type: integer
          format: int32
        date:
          type: string
          format: date
          nullable: true
        weather:
          type: string
          nullable: true
        narrative:
          type: string
          nullable: true
        notes:
          type: array
          items:
            type: string
        stops:
          type: array
          items:
            $ref: '#/components/schemas/SavedTripStopResponse'
    SavedTripStopResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        poiId:
          type: string
          format: uuid
          nullable: true
        nameTr:
          type: string
          nullable: true
        nameEn:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        subcategory:
          type: string
          nullable: true
        lat:
          type: number
          format: double
          nullable: true
        lon:
          type: number
          format: double
          nullable: true
        score:
          type: number
          format: double
          nullable: true
        travelMinutes:
          type: integer
          format: int32
          nullable: true
        visitMinutes:
          type: integer
          format: int32
          nullable: true
        startTime:
          type: string
          nullable: true
        endTime:
          type: string
          nullable: true
        openAtScheduledTime:
          type: boolean
          nullable: true
        reasons:
          type: array
          items:
            type: string
        factors:
          type: object
          additionalProperties:
            type: number
