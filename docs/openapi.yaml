          type: integer
          format: int32
        date:
          type: string
          format: date
          nullable: true
        weather:
          type: string
          nullable: true
        narrative:
          type: string
          nullable: true
        notes:
          type: array
          items:
            type: string
        stops:
          type: array
          items:
            $ref: '#/components/schemas/UpdateTripStop'
    UpdateTripStop:
      type: object
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: Existing stop id (optional; the plan is replaced wholesale)
        poiId:
          type: string
          format: uuid
          nullable: true
        nameTr:
          type: string
          nullable: true
        nameEn:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        subcategory:
          type: string
          nullable: true
        lat:
          type: number
          format: double
          nullable: true
        lon:
          type: number
          format: double
          nullable: true
        score:
          type: number
          format: double
          nullable: true
        travelMinutes:
          type: integer
          format: int32
          nullable: true
        visitMinutes:
          type: integer
          format: int32
          nullable: true
        startTime:
          type: string
          nullable: true
        endTime:
          type: string
          nullable: true
        openAtScheduledTime:
          type: boolean
          nullable: true
        reasons:
          type: array
          items:
            type: string
        factors:
          type: object
          additionalProperties:
            type: number
            format: double
    RecalculateTripRequest:
      type: object
      required: [tripId, event]
      properties:
        tripId:
          type: string
          format: uuid
        event:
          type: string
          enum: [RAIN, DELAY, ROAD_CLOSURE]
        eventDate:
          type: string
          format: date
          nullable: true
          description: Day from which the recalculation applies (null = whole trip)
        delayMinutes:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: Required for DELAY
        affectedStopId:
          type: string
          format: uuid
          nullable: true
          description: Required for ROAD_CLOSURE
        note:
          type: string
          nullable: true